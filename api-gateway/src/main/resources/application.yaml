server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: produits-service
              uri: lb://produits-service
              predicates:
                - Path=/api/produits/**, Path=/api/categories/**
            - id: avis-service
              uri: lb://avis-service
              predicates:
                - Path=/api/avis/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/